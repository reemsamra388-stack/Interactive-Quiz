<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Interactive Quiz | Blended Learning</title>
<style>
:root{--navy:#14263d;--teal:#39b6ad;--ink:#192b40;--muted:#637187;--paper:#f5f7fa;--line:#dbe3ec;--good:#18794e;--bad:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.shell{width:min(780px,100%);background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #14263d18}
header{background:var(--navy);color:white;padding:25px 30px;border-bottom:4px solid var(--teal)}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:11px;font-weight:700;color:#8ce2da}h1{font-size:clamp(23px,4vw,32px);margin:9px 0 5px}header p{margin:0;color:#d6e0eb;font-size:14px;line-height:1.5}
main{padding:28px 30px 26px}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px;font-weight:700}.track{height:6px;background:#e8edf3;border-radius:99px;margin:12px 0 24px;overflow:hidden}.fill{height:100%;background:var(--teal);width:0;transition:width .2s}h2{font-size:21px;line-height:1.45;margin:0 0 20px}.answers{display:grid;gap:10px}.answer{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);border-radius:11px;background:white;padding:14px 16px;font-size:15px;line-height:1.45;color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}.answer:hover:not(:disabled){border-color:var(--teal);background:#f3fbfa}.letter{flex:0 0 27px;height:27px;display:grid;place-items:center;border-radius:7px;background:#edf2f7;color:var(--navy);font-weight:700;font-size:13px}.answer:disabled{cursor:default}.answer.right{border-color:#6bc69b;background:#effaf3}.answer.wrong{border-color:#e7a19a;background:#fff4f2}.feedback{min-height:46px;margin-top:18px;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5;display:none}.feedback.show{display:block}.feedback.good{background:#effaf3;color:#17603f}.feedback.bad{background:#fff4f2;color:#982b22}.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-top:22px}.btn{border:0;border-radius:9px;padding:12px 17px;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.primary{background:var(--navy);color:white}.primary:disabled{opacity:.35;cursor:not-allowed}.secondary{background:#eef2f6;color:var(--navy)}.return{color:var(--navy);border:1px solid var(--line);background:white}.complete{text-align:center;padding:20px 0}.complete .mark{font-size:42px;color:var(--good)}.complete h2{margin:8px 0}.complete p{color:var(--muted);line-height:1.6}.foot{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.5}
@media(max-width:520px){body{padding:10px}.shell{border-radius:13px}header,main{padding:21px 18px}.actions{align-items:stretch}.actions .btn{flex:1}.topline{font-size:12px}}
</style></head><body><div class="shell"><header><div class="eyebrow">University English Course</div><h1>Interactive Quiz</h1><p>Tips for Fostering Student Engagement in Blended Learning</p></header><main id="app"><div class="topline"><span id="count">Question 1 of 10</span><span id="score">Score: 0</span></div><div class="track"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="btn secondary" id="restart">Restart quiz</button><button class="btn primary" id="next" disabled>Next question →</button></div><div class="foot">Choose an answer to get immediate feedback. If it is incorrect, try again. A correct answer unlocks the next question.</div></main></div>
<script>
const questions=[{"q": "According to the learning content, what is emotional engagement?", "options": ["How emotionally invested students feel in their learning", "How often students submit assignments", "How quickly students finish a lesson", "How many digital tools students use"], "a": 0, "why": "The document defines emotional engagement as how emotionally invested students are in their learning."}, {"q": "What does agentic engagement describe?", "options": ["Students staying silent during a lesson", "Students proactively contributing to their learning", "Students memorizing information without discussion", "Teachers choosing every learning activity"], "a": 1, "why": "Agentic engagement reflects students’ proactive efforts to contribute, such as asking questions and sharing ideas."}, {"q": "Which group of emotions can support attention and motivation?", "options": ["Anxiety, worry, and fear", "Sadness, stress, and disinterest", "Curiosity, interest, and joy", "Embarrassment, worry, and fear"], "a": 2, "why": "The document says positive emotions such as curiosity, interest, and joy can aid focus, attention, and motivation."}, {"q": "According to the document, how can negative emotions affect learning?", "options": ["They always improve memory", "They can interfere with attention and motivation", "They guarantee stronger participation", "They remove the need for support"], "a": 1, "why": "The document explains that anxiety, stress, worry, and fear can impede learning processes and motivation."}, {"q": "Which three needs are linked to motivation in Self-Determination Theory (SDT)?", "options": ["Attention, memory, and speed", "Grades, attendance, and homework", "Autonomy, competence, and relatedness", "Technology, testing, and time"], "a": 2, "why": "The source names autonomy (choice), competence (mastery/capability), and relatedness (connection)."}, {"q": "Which approach can help create a safe space for student interaction?", "options": ["Allowing only spoken answers in class", "Using anonymous questions or polls", "Avoiding student questions", "Giving feedback only at the end of term"], "a": 1, "why": "Anonymous Q&As and polling can reduce fear of judgment or embarrassment and help students participate."}, {"q": "Which is an example of giving students meaningful choice?", "options": ["Letting students choose a learning resource or set a goal", "Removing all learning goals", "Making every student use one resource", "Asking students to avoid digital tools"], "a": 0, "why": "The document describes choosing online resources, setting personal goals, and selecting strategies for a project."}, {"q": "What example does the document give for using technology to reinforce learning in allied health?", "options": ["A public social-media contest", "A virtual anatomy website with interactive 3D models", "A lecture with no student activity", "A printed attendance sheet"], "a": 1, "why": "Students can explore anatomical structures, interact with 3D models, and quiz themselves on key terms."}, {"q": "How does the document suggest connecting theory to practice?", "options": ["Keep all learning inside the classroom", "Focus only on memorizing definitions", "Use real-world case studies such as local businesses or campus events", "Replace concepts with unstructured conversation"], "a": 2, "why": "The source recommends real-world case studies, including local businesses and campus events, to apply learning."}, {"q": "What is the overall conclusion of the learning content?", "options": ["Students learn best when they have no choices", "Supportive environments, choice, and relevance can foster enthusiasm and ownership", "Only face-to-face teaching can create engagement", "Teachers should avoid connecting lessons to real life"], "a": 1, "why": "The conclusion emphasizes supportive learning environments, student choice, and relevance to students’ lives."}];
let index=0,score=0,solved=new Set(),attemptedWrong=new Set();
const $=id=>document.getElementById(id);
function render(){
 if(index>=questions.length){
  $('app').innerHTML=`<div class="complete"><div class="mark">✓</div><h2>Quiz complete!</h2><p>You answered ${score} out of ${questions.length} questions correctly on the first try.<br>You completed the learning check on blended learning and student engagement.</p><div class="actions" style="justify-content:center"><button class="btn secondary" id="again">Try again</button><a class="btn return" href="Tips-for-Fostering-Student-Engagement-in-Blended-Learning-Interactive.pptx">Return to presentation</a></div></div>`;
  $('again').onclick=()=>location.reload();return;
 }
 const q=questions[index];$('count').textContent=`Question ${index+1} of ${questions.length}`;$('score').textContent=`Score: ${score}`;$('fill').style.width=`${index/questions.length*100}%`;$('question').textContent=q.q;$('answers').innerHTML='';$('feedback').className='feedback';$('feedback').textContent='';$('next').disabled=!solved.has(index);$('next').textContent=index===questions.length-1?'Finish quiz ✓':'Next question →';
 q.options.forEach((label,i)=>{const b=document.createElement('button');b.className='answer';b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}</span><span></span>`;b.querySelector('span:last-child').textContent=label;b.onclick=()=>choose(i,b);$('answers').appendChild(b)});
}
function choose(i,button){if(solved.has(index))return;const q=questions[index],fb=$('feedback');if(i===q.a){if(!attemptedWrong.has(index))score++;solved.add(index);fb.className='feedback show good';fb.textContent='Correct! '+q.why;button.classList.add('right');[...$('answers').children].forEach(b=>b.disabled=true);$('next').disabled=false;$('score').textContent=`Score: ${score}`;$('fill').style.width=`${(index+1)/questions.length*100}%`;}else{attemptedWrong.add(index);fb.className='feedback show bad';fb.textContent='Incorrect, try again! Choose another answer.';button.classList.add('wrong');button.disabled=true;}}
$('next').onclick=()=>{if(solved.has(index)){index++;render()}};$('restart').onclick=()=>location.reload();render();
</script></body></html>
